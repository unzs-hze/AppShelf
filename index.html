<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>本机应用清单 · AppShelf</title>
<meta name="description" content="把电脑里装的软件整理成一本目录：名称、作用、安装地址、占用与来源，可搜索可筛选可编辑。">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="index">
  <header class="masthead">
    <div class="container">
      <p class="eyebrow">AppShelf &nbsp;·&nbsp; 本机应用清单</p>
      <h1>本机安装应用目录</h1>
      <p class="lede">一本可以翻的软件目录——装了什么、装在哪、做什么用、占多大，一目了然。</p>
      <dl class="stats">
        <div><dt id="stat-count">—</dt><dd>应用条目</dd></div>
        <div><dt id="stat-cat">—</dt><dd>子类分区</dd></div>
        <div><dt id="stat-dl">—</dt><dd>下载安装</dd></div>
        <div><dt id="stat-size">—</dt><dd>合计占用</dd></div>
      </dl>
    </div>
  </header>

  <main class="container">
    <nav class="crumb" id="crumb" hidden></nav>
    <div class="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="搜索应用名称、作用或路径…" autocomplete="off">
      </label>
      <nav class="chips" id="chips" aria-label="分类（点击进入独立页面）"></nav>
      <nav class="chips chips-drive" id="drive-chips" aria-label="盘符筛选"></nav>
    </div>

    <p class="result" id="result"></p>
    <section class="catalog" id="catalog"></section>
  </main>

  <footer>
    <div class="container">
      <p><strong>AppShelf</strong> · 数据来自 <code>data/apps.json</code>。本地编辑：<code>python server.py</code> 后可在页面直接修改并写回；<code>scripts/scan.ps1</code> 可重新扫描本机。</p>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/app.js"></script>
  <script src="assets/index.js"></script>
</body>
</html>
